<body>
<style>
/* Layout: ein schmales „Formular-Heft“ in Schritten – nummerierte Felder mit Feldcodes,
   Kurs-Karteikarten mit Passung und Voraussetzungs-Stempeln, am Ende ein Prüfvermerk. */
:root {
  --paper: #F2F5F1;
  --sheet: #FFFFFF;
  --field: #FBFCFA;
  --ink: #15201C;
  --ink-2: #47564F;
  --ink-3: #6E7D76;
  --rule: #D9E1DC;
  --rule-strong: #B9C6BF;
  --accent: #16604E;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDEEE7;
  --marker: #FAE184;
  --ok: #1F6E45; --ok-soft: #DFF1E6;
  --warn: #8A5A0E; --warn-soft: #FAEDD3;
  --bad: #A2302A; --bad-soft: #F7E1DE;
  --focus: #2C68D1;
  --shadow: 0 1px 0 rgba(21, 32, 28, 0.04), 0 8px 24px -16px rgba(21, 32, 28, 0.25);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1412; --sheet: #151D1A; --field: #111815;
    --ink: #E3ECE7; --ink-2: #A7B6AF; --ink-3: #7F8E88;
    --rule: #26322D; --rule-strong: #3A4842;
    --accent: #5BC6A3; --accent-ink: #08170F; --accent-soft: #163029;
    --marker: #5B4C12;
    --ok: #74D39C; --ok-soft: #14301F; --warn: #E7B660; --warn-soft: #332810; --bad: #F2897E; --bad-soft: #3A1B18;
    --focus: #86B3FF;
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 8px 24px -16px rgba(0, 0, 0, 0.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1412; --sheet: #151D1A; --field: #111815;
  --ink: #E3ECE7; --ink-2: #A7B6AF; --ink-3: #7F8E88;
  --rule: #26322D; --rule-strong: #3A4842;
  --accent: #5BC6A3; --accent-ink: #08170F; --accent-soft: #163029;
  --marker: #5B4C12;
  --ok: #74D39C; --ok-soft: #14301F; --warn: #E7B660; --warn-soft: #332810; --bad: #F2897E; --bad-soft: #3A1B18;

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : String(v));
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === undefined || kid === null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const label = (list, key) => (list.find((x) => x[0] === key) || [])[1] || "";
const rankOf = (list, key) => { const x = list.find((y) => y[0] === key); return x ? x[2] : undefined; };
const DAY = 864e5;
function today() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function fmtDate(d) { return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }); }
function fmtMonth(v) { if (!v) return ""; const [y, m] = String(v).split("-"); return m ? `${m}/${y}` : v; }
function fmtIsoDate(v) { if (!v) return ""; const d = new Date(v + "T00:00:00"); return isNaN(d) ? v : fmtDate(d); }
function fmtNum(n) { return n.toLocaleString("de-DE", { maximumFractionDigits: 2 }); }
function fmtMonthYear(d) { return d.toLocaleDateString("de-DE", { month: "long", year: "numeric" }); }
function euro(n) { return n.toLocaleString("de-DE", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }); }
function toast(msg) {

}

function blockVisible(b) { return !b.show || b.show(state.f); }

function onInput(e) {

  if (el.type === "checkbox" && el.dataset.multi) {
    state.f[el.name] = $$(`input[name="${el.name}"]:checked`, form).map((i) => i.value);

/* =====================================================================
   8) Empfehlungslogik
   ===================================================================== */
const STATUS_SCORE = { ok: 1, bridge: 0.65, unknown: 0.8, miss: 0 };
const START_WINDOW = { asap: [0, 12], "1-3": [0, 14], "3-6": [8, 28] };
function leadDays() { return BESCHAEFTIGT.includes(state.f.situation) ? FOERDER.vorlaufTage : 21; }

function nextStart(c) {
  const t = today();
  const dates = (c.start && c.start.dates || [])
    .map((d) => new Date(d + "T00:00:00"))
    .filter((d) => (d - t) / DAY >= leadDays())
    .sort((a, b) => a - b);
  if (dates.length) return { kind: "date", date: dates[0], text: fmtDate(dates[0]), more: dates.slice(1, 3).map(fmtDate) };
  if (c.start && c.start.rhythm) return { kind: "rhythm", text: c.start.rhythm };
  return { kind: "unknown", text: "Termin auf Anfrage" };
}

function itHave(areas) {
  const vals = areas.map((a) => state.f["it_" + a]).filter(has).map(Number);
  return vals.length ? Math.max(...vals) : null;
}

function evaluate(c) {
  const f = state.f;
  const r = c.req || {};
  const reqs = [];
  const notes = [];
  // Voraussetzungen
  if (r.schule) {
    const need = rankOf(SCHULE, r.schule);
    if (!has(f.schule)) reqs.push(["unknown", `Schulabschluss: mind. ${label(SCHULE, r.schule)}`]);
    else if (f.schule === "ausland") reqs.push(["unknown", "Ausländischer Schulabschluss: Anerkennung klären"]);
    else if (rankOf(SCHULE, f.schule) >= need) reqs.push(["ok", "Schulabschluss passt"]);
    else reqs.push([r.schuleBridge ? "bridge" : "miss", r.schuleBridge || `Braucht mind. ${label(SCHULE, r.schule)}`]);
  }
  if (r.ausbildung) {
    const exp = Number(f.erfahrung || 0);
    if (!has(f.ausbildung)) reqs.push(["unknown", r.ausbildungText || "Berufsabschluss"]);
    else if (f.ausbildung === "ja") reqs.push(["ok", "Berufsabschluss vorhanden"]);
    else if (r.erfahrungJahre && exp >= r.erfahrungJahre) reqs.push(["ok", `${exp} Jahre Berufserfahrung`]);
    else reqs.push(["miss", r.ausbildungText || "Braucht abgeschlossene Ausbildung"]);
  }
  for (const [key, name] of [["deutsch", "Deutsch"], ["englisch", "Englisch"]]) {
    if (!r[key]) continue;
    const need = rankOf(SPRACHE, r[key]);
    if (!has(f[key])) reqs.push(["unknown", `${name}: mind. ${label(SPRACHE, r[key]).replace(/ \(.*\)/, "")} (${r[key].toUpperCase()})`]);
    else if (rankOf(SPRACHE, f[key]) >= need) reqs.push(["ok", `${name} reicht`]);
    else reqs.push([key === "deutsch" && r.deutschBridge ? "bridge" : "miss", key === "deutsch" && r.deutschBridge ? r.deutschBridge : `${name}: mind. ${r[key].toUpperCase()} nötig`]);
  }
  if (r.it !== undefined) {
    const have = itHave(r.itAreas || ["office", "hardware", "netzwerk", "linux", "code"]);
    if (have === null) reqs.push(["unknown", r.itText || "IT-Vorkenntnisse"]);
    else if (have >= r.it) reqs.push(["ok", r.itOk || "Vorkenntnisse reichen"]);
    else reqs.push([r.itBridge ? "bridge" : "miss", r.itBridge || r.itMiss || "Vorkenntnisse fehlen"]);
  }
  if (r.fuehrerschein) {
    if (!has(f.fuehrerschein)) reqs.push(["unknown", "Führerschein Klasse B"]);
    else if (f.fuehrerschein === "ja") reqs.push(["ok", "Führerschein vorhanden"]);
    else reqs.push(["miss", "Führerschein Klasse B nötig"]);
  }
  if (c.laptop === "eigener" && has(f.technik) && !f.technik.includes("laptop")) reqs.push(["bridge", "Eigener Laptop nötig"]);
  else if (!c.laptop && c.format.includes("online") && !c.format.includes("praesenz") && has(f.technik) && !f.technik.includes("laptop")) reqs.push(["bridge", "Laptop/PC nötig – ansprechen"]);
  const info = [...(r.info || [])];
  if (r.itSkip) { const lv = itHave(r.itAreas || ["office", "hardware", "netzwerk", "linux", "code"]); if (lv !== null && lv >= r.itSkip.level) info.push(r.itSkip.text); }

  const reqScore = reqs.length ? reqs.reduce((s, [st]) => s + STATUS_SCORE[st], 0) / reqs.length : 0.85;

  // Interessen: Breite (wie viele deiner Top-Interessen der Kurs bedient), Fokus (wie viel vom Kurs
  // zu deinen Interessen passt) und Stärke (ist eines deiner Interessen der Hauptinhalt des Kurses?)
  const chosen = f.interessen || [];
  const ctags = c.tags || {};
  const tagSet = new Set(chosen.flatMap((k) => INTEREST_TAGS[k] || []));
  let interest = 0.45;
  const hits = [];
  if (tagSet.size) {
    const perInterest = chosen.map((k) => Math.max(0, ...(INTEREST_TAGS[k] || []).map((t) => ctags[t] || 0)) / 4);
    const breadth = Math.min(1, perInterest.reduce((a, b) => a + b, 0) / Math.min(chosen.length, 3));
    const total = Object.values(ctags).reduce((a, b) => a + b, 0) || 1;
    const matched = Object.entries(ctags).filter(([t]) => tagSet.has(t)).reduce((a, [, w]) => a + w, 0);
    const strength = Math.max(0, ...Object.entries(ctags).filter(([t]) => tagSet.has(t)).map(([, w]) => w)) / 4;
    interest = 0.45 * breadth + 0.35 * (matched / total) + 0.2 * strength;
    chosen.forEach((k, i) => { if (perInterest[i] >= 0.5) hits.push(label(INTERESTS, k)); });
  }
  const wants = new Set(f.wuensche || []);
  const wantHits = [];
  if (wants.has("remote") && c.remote) { interest += 0.08; wantHits.push("remote-tauglicher Beruf"); }
  if (wants.has("ihk") && c.ihk === "beruf") { interest += 0.16; wantHits.push("IHK-Berufsabschluss"); }
  else if (wants.has("ihk") && c.ihk) { interest += 0.07; wantHits.push("IHK-Zertifikat"); }
  if (wants.has("schnell") && c.dauerMin <= 6) { interest += 0.06; wantHits.push("kurze Dauer"); }
  if (wants.has("kreativ") && ["design", "marketing", "games", "web"].some((t) => (c.tags || {})[t] >= 2)) interest += 0.05;
  if (wants.has("menschen") && ["hr", "sales", "pm"].some((t) => (c.tags || {})[t] >= 2)) interest += 0.05;
  interest = Math.min(1, interest);

  // Ausschlüsse
  let factor = 1;
  const nogos = new Set(f.nogos || []);
  const tags = c.tags || {};
  if (nogos.has("handwerk") && c.praxis) { factor *= 0.15; notes.unshift("passt nicht zu „kein Handwerk“"); }
  if (nogos.has("verkauf") && (tags.sales || 0) >= 3) { factor *= 0.3; notes.unshift("viel Vertrieb"); }
  if (nogos.has("mathe") && (tags.data || 0) >= 3) { factor *= 0.6; notes.unshift("viel mit Zahlen"); }
  if (nogos.has("code") && (tags.coding || 0) >= 3) { factor *= 0.5; notes.unshift("viel Programmieren"); }
  if (nogos.has("vorort") && !c.format.includes("online")) { factor *= 0.4; notes.unshift("nur vor Ort"); }

  // Rahmen
  let fit = 1;
  if (f.lernform === "online" && !c.format.includes("online")) { fit -= 0.6; notes.push("nur vor Ort"); }
  if (f.lernform === "praesenz" && !c.format.includes("praesenz")) { fit -= 0.15; notes.push("nur online"); }
  if (c.praesenzPflicht) {
    if (f.lernform === "online") { fit -= 0.3; notes.push("teilweise vor Ort an einem Standort"); }
    else if (has(f.orte) && !(c.orte || []).some((o) => f.orte.includes(o))) { fit -= 0.2; notes.push("kein Standort in deiner Auswahl"); }
  }
  if (f.lernform && f.lernform !== "online" && has(f.orte) && c.format.includes("praesenz") && !c.format.includes("online") && !(c.orte || []).some((o) => f.orte.includes(o))) {
    fit -= 0.35; notes.push("Standort nicht in deiner Auswahl");
  }
  const max = has(f.dauer) && f.dauer !== "egal" ? Number(f.dauer) : null;
  if (max) {
    if (c.dauerMin > max) { fit -= 0.4; notes.push(`dauert länger als gewünscht (${c.dauerText})`); }

  if (f.zeitmodell === "tz" && !c.zeit.includes("tz")) { fit -= 0.3; notes.push("nur Vollzeit"); }
  if (f.zeitmodell === "vz" && !c.zeit.includes("vz")) { fit -= 0.1; notes.push("nur Teilzeit"); }
  const ns = nextStart(c);
  if (has(f.start) && f.start !== "egal" && ns.kind === "date") {
    const weeks = (ns.date - today()) / DAY / 7;
    const [lo, hi] = START_WINDOW[f.start];
    if (weeks > hi) { fit -= 0.15; notes.push(`nächster Termin erst ${ns.text}`); }
    else if (weeks < lo) info.push("Der nächste Termin liegt früher als gewünscht – ein späterer ist möglich.");
  }
  if (f.situation && BESCHAEFTIGT.includes(f.situation) && c.qcg === false) { fit -= 0.5; notes.push("für Beschäftigte nicht förderbar"); }
  fit = Math.max(0, fit);

  const hardMiss = reqs.some(([st]) => st === "miss") ? 0.55 : 1;
  const score = Math.round(100 * interest * (0.6 + 0.4 * reqScore) * hardMiss * (0.3 + 0.7 * fit) * factor);

  if (hits.length) reasons.push("Passt zu: " + hits.slice(0, 3).join(", "));
  if (wantHits.length) reasons.push("Dir wichtig: " + wantHits.join(", "));
  const worst = reqs.find(([st]) => st === "miss") || reqs.find(([st]) => st === "bridge");
  if (!worst && reqs.length && reqs.every(([st]) => st === "ok")) reasons.push("Voraussetzungen erfüllt");
  else if (worst && worst[0] === "bridge") reasons.push("Machbar: " + worst[1]);
  return { score, reqs, notes: [...new Set(notes)], info, reasons, next: ns };
}

function fitLabel(s) {

function stepComplete(i) {
  const s = STEPS[i];
  if (s.key === "start") return state.step > 0;
  if (s.key === "vorschlaege") return !!state.choice;
  const qs = (s.blocks || []).flatMap((b) => b.qs.map((q) => ({ q, b })));
  const req = qs.filter(({ q, b }) => q.req && qVisible(q, b));
  if (!req.length) return qs.some(({ q, b }) => qVisible(q, b) && answered(q));
  return req.every(({ q }) => answered(q));
}
function refresh(full) {

  STEPS.forEach((s) => (s.blocks || []).forEach((b) => {
    const bv = blockVisible(b);
    if (b._el) b._el.hidden = !bv;
    b.qs.forEach((q) => { const el = form.querySelector(`[data-q="${q.id}"]`); if (el) el.hidden = !(bv && (!q.show || q.show(state.f))); });
  }));

  });

  const req = allQuestions().filter(({ q, b }) => q.req && qVisible(q, b));
  const done = req.filter(({ q }) => answered(q)).length;

      }
    } catch (err) {
      const code = err && err.code;
